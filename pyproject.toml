[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "simplified-vehicle-models"
version = "0.1.0"
description = "Simplified vehicle models and lap simulation tools"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
forward = ["scipy>=1.11"]
gui = ["PyQt6>=6.5"]

[tool.setuptools.packages.find]
where = ["src"]
